name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - name: Install the project (exactly the versions in uv.lock)
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check

      - name: Check formatting
        run: uv run ruff format --check

      - name: Tests
        run: uv run pytest

      - name: Run every script
        env:
          MPLBACKEND: Agg
        run: for f in scripts/*.py; do uv run "$f" > /dev/null; done
